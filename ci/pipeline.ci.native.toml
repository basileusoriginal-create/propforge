## CI-Konfiguration: CWXML-Export, damit das Ergebnis maschinell pruefbar ist.

[pipeline]
resource_name = "pf_ci_testpack_native"
author = "PropForge CI"
workdir = "out"
export_format = "NATIVE"
export_version = "GEN8"

[defaults]
shader = "normal_spec.sps"
# Der Generator schreibt in Blender-Konvention (Z-up). Ohne diese Zeile
# nimmt Blenders OBJ-Importer Y-up an und legt den Prop auf die Seite --
# formal fehlerfrei, im Spiel unbrauchbar.
source_up = "z"
texture_size = 512
max_tris = 2000
flip_normal_green = true

[defaults.lods.ratios]
high = 1.0
medium = 0.5
low = 0.22
verylow = 0.08

[defaults.lods.distances]
high = 60.0
medium = 120.0
low = 250.0
verylow = 500.0

[defaults.collision]
enabled = true
kind = "hull"
flag_preset = "General (Default)"
source_lod = "low"

[[prop]]
name = "pf_testprop"
mesh = "assets/pf_testprop.obj"

[prop.textures]
diffuse = "assets/pf_testprop_albedo.png"
normal = "assets/pf_testprop_normal.png"
roughness = "assets/pf_testprop_roughness.png"
metallic = "assets/pf_testprop_metallic.png"


# Der harte Fall: Sockel, duenne Streben, Gelaender, Kleinteil.
# Hier entscheidet sich, ob die LOD-Kette taugt - eine Kugel ist zu gutmuetig.
[[prop]]
name = "pf_rig"
mesh = "assets/pf_rig.obj"
max_tris = 1700

[prop.textures]
diffuse = "assets/pf_rig_albedo.png"
normal = "assets/pf_rig_normal.png"
roughness = "assets/pf_rig_roughness.png"
metallic = "assets/pf_rig_metallic.png"


# Echtes Marktplatz-Asset (Fab), durch propforge ingest aufbereitet.
# Deckt ab, was synthetische Testobjekte nicht zeigen: gepackte
# metallicRoughness, eingebettete Texturen, versetzter Ursprung.
[[prop]]
name = "pf_desk"
mesh = "assets/pf_desk.glb"
source_up = "y"
max_tris = 2923
center = "base"

[prop.collision]
# Der Tisch ist aus Holz - das bestimmt Schrittgeraeusche, Einschlaege
# und Bruchverhalten. DEFAULT klaenge nach nichts Bestimmtem.
material = "WOOD_SOLID_MEDIUM"

[prop.textures]
diffuse = "assets/pf_desk_albedo.png"
roughness = "assets/pf_desk_roughness.png"
metallic = "assets/pf_desk_metallic.png"
normal = "assets/pf_desk_normal.png"
