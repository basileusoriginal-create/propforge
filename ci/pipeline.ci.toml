## CI-Konfiguration: CWXML-Export, damit das Ergebnis maschinell pruefbar ist.

[pipeline]
resource_name = "pf_ci_testpack"
author = "PropForge CI"
workdir = "out"
export_format = "CWXML"
export_version = "GEN8"

[defaults]
shader = "normal_spec.sps"
texture_size = 512
max_tris = 2000
flip_normal_green = true

[defaults.lods.ratios]
high = 1.0
medium = 0.5
low = 0.22
verylow = 0.08

[defaults.lods.distances]
high = 60.0
medium = 120.0
low = 250.0
verylow = 500.0

[defaults.collision]
enabled = true
kind = "hull"
flag_preset = "Default"
source_lod = "low"

[[prop]]
name = "pf_testprop"
mesh = "assets/pf_testprop.obj"

[prop.textures]
diffuse = "assets/pf_testprop_albedo.png"
normal = "assets/pf_testprop_normal.png"
roughness = "assets/pf_testprop_roughness.png"
metallic = "assets/pf_testprop_metallic.png"


# Der harte Fall: Sockel, duenne Streben, Gelaender, Kleinteil.
# Hier entscheidet sich, ob die LOD-Kette taugt - eine Kugel ist zu gutmuetig.
[[prop]]
name = "pf_rig"
mesh = "assets/pf_rig.obj"
max_tris = 1700

[prop.textures]
diffuse = "assets/pf_rig_albedo.png"
normal = "assets/pf_rig_normal.png"
roughness = "assets/pf_rig_roughness.png"
metallic = "assets/pf_rig_metallic.png"
